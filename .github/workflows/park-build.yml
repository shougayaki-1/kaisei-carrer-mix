name: Park typecheck and build

on:
  pull_request:
    paths:
      - "park/**"
      - "vite.config.ts"
      - "package.json"
      - ".github/workflows/park-build.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build all Vite pages
        run: npm run build
