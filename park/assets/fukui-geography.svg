<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 750" role="img" aria-labelledby="map-title map-desc">
<title id="map-title">福井県と小松空港周辺の位置図</title>
<desc id="map-desc">公開GeoJSONの石川県・福井県行政界を使用した概略地図。北を上にし、小松空港は石川県側、福井駅・勝山・越前海岸・若狭湾は福井県側。体験施設の敷地や交通経路を表すものではありません。</desc>
